<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidel Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="status-badge">
                <div class="status-dot"></div>
                CONNECTED
            </div>
            <div class="user-profile">
                <span id="username">royalsup1</span>
                <button class="logout-btn">🚪</button>
            </div>
        </header>

        <div class="error-banner">
            <span>💰 Insufficient balance for stake</span>
            <strong>Need: 10 | Have: 5</strong>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-label">DERASH</span>
                <span class="stat-value" id="derash">168</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">PLAYERS</span>
                <span class="stat-value" id="players">21</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">BET</span>
                <span class="stat-value" id="bet-amount">10</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">CALLS</span>
                <span class="stat-value" id="call-count">5</span>
            </div>
        </div>

        <div class="game-main">
            <div class="bingo-headers">
                <span class="header-B">B</span>
                <span class="header-I">I</span>
                <span class="header-N">N</span>
                <span class="header-G">G</span>
                <span class="header-O">O</span>
            </div>
            <div class="bingo-grid" id="bingo-board">
                <!-- Grid cells injected by JS -->
            </div>
        </div>

        <div class="call-display">
            <span class="stat-label">CURRENT CALL</span>
            <div class="ball-main" id="active-ball">N 34</div>
            <div class="ball-history" id="recent-balls">
                <!-- Recent balls injected by JS -->
            </div>
        </div>

        <div class="footer-stats">
            <span>Total Called: <span id="progress-text">5/75</span></span>
            <div style="width: 150px">
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
