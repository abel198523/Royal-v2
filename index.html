<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidel Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="welcome-screen" class="welcome-screen active">
            <div class="welcome-box">
                <div class="welcome-logo">FIDEL BINGO</div>
                <div class="welcome-subtitle">እንኳን ደህና መጡ</div>
                <div class="welcome-actions">
                    <a href="https://t.me/your_bot_username" target="_blank" class="welcome-btn telegram-btn">ቦቱን ተቀላቀል (Join Bot)</a>
                    <button class="welcome-btn" onclick="showAuth('signup')">ጆይንድ (Joined)</button>
                </div>
            </div>
        </div>

        <div id="auth-screen" class="auth-screen" style="display: none;">
            <div class="auth-box">
                <h1 class="auth-logo">FIDEL BINGO</h1>
                <div id="login-form">
                    <h2>Login</h2>
                    <input type="text" id="login-telegram" placeholder="Telegram Chat ID">
                    <input type="password" id="login-pass" placeholder="Password">
                    <button id="do-login" class="auth-btn">Login</button>
                    <p>No account? <a href="#" onclick="showSignup()">Sign up</a></p>
                </div>
            </div>
        </div>

        <div id="main-content" style="display: none;">
            <div id="stake-screen" class="stake-screen">
                <div class="selection-header">
                    <div class="selection-title">የመጫወቻ ክፍል ይምረጡ</div>
                    <div class="user-profile"><span id="stake-username">---</span></div>
                </div>
                <div class="stake-list" id="stake-rooms-list">
                    </div>
            </div>

            <div id="game-screen" class="game-screen" style="display: none;">
                <div class="game-header-stats">
                    <div class="stat-box-dark">BET: <span id="bet-amount">0</span></div>
                    <div class="stat-box-dark">PLAYERS: <span id="players">0</span></div>
                </div>
                <div id="master-grid" class="master-grid"></div>
                <div class="active-ball-display"><span id="active-ball">--</span></div>
                <div id="bingo-board" class="player-card-grid"></div>
                <button id="bingo-btn" class="bingo-btn">BINGO!</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
